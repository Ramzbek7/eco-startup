<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b3d2c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>EkoCoin — Ekologik platforma</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #f3faf4; --text: #13261a; --muted: #56705c; --head: #0b3d2c;
  --green: #1f8a4c; --lime: #a3e635; --teal: #14b8a6; --card: #ffffff;
  --line: #cfe8d5; --input: #f7fdf8; --soft: #ecfccb; --nav: #0b3d2c;
}
:root[data-theme="dark"] {
  --bg: #0c1d15; --text: #e6f5ea; --muted: #9bbfa6; --head: #bfe9cc;
  --card: #132a1f; --line: #24513a; --input: #0f2319; --soft: #1d3b2a;
}
* {
     margin: 0; padding: 0; box-sizing: border-box; 
}
html {
     scroll-behavior: smooth; 
}
body { 
     font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
     background: var(--bg);
     color: var(--text);
     line-height: 1.6;
}
.wrap {
     max-width: 1080px;
     margin: 0 auto;
     padding: 0 1.25rem;
 }
.lite { padding-bottom: calc(3.2rem + 10px); }

nav { position: sticky; top: 0; z-index: 1000; background: var(--nav); color: #e8fbe9; }
nav .wrap { display: flex; justify-content: space-between; align-items: center; gap: .8rem; min-height: 58px; padding-top: .5rem; padding-bottom: .5rem; }
nav .logo { font-weight: 800; font-size: 1.1rem; color: var(--lime); flex-shrink: 0; }
nav .links { display: flex; gap: .9rem; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; justify-content: center; }
nav .links::-webkit-scrollbar { display: none; }
nav .links a { color: #bfe9cc; text-decoration: none; font-size: .9rem; white-space: nowrap; }
nav .links a:hover { color: var(--lime); }
.tools { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }
.tools select { width: auto; padding: .3rem .5rem; font-size: .85rem; }
.tools button { margin: 0; width: auto; padding: .35rem .7rem; font-size: .85rem; }

@media (max-width: 860px) {
  nav .wrap { flex-wrap: wrap; }
  nav .links { order: 3; width: 100%; justify-content: flex-start; padding-bottom: .3rem; }
}

.hero { background: linear-gradient(135deg, #0b3d2c 0%, #1f8a4c 55%, #14b8a6 100%); color: #f0fff4; padding: 4rem 0 3.5rem; text-align: center; }
.badge { display: inline-block; padding: .35rem .95rem; border-radius: 999px; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); font-size: .85rem; font-weight: 600; }
.hero h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); letter-spacing: -.03em; margin: 1rem 0 .5rem; }
.hero .sub { max-width: 38rem; margin: 0 auto; opacity: .9; }
.balance { display: inline-block; margin-top: 1.8rem; background: var(--lime); color: #0b3d2c; padding: .9rem 2.2rem; border-radius: 18px; font-size: 1.8rem; font-weight: 800; }

section { padding: 3.2rem 0; }
.eyebrow { color: var(--green); font-size: .8rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 30px; }
h2 { font-size: clamp(1.6rem, 3.5vw, 2.1rem); letter-spacing: -.02em; margin: .4rem 0 1.4rem; color: var(--head); }

.grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 1.6rem; box-shadow: 0 4px 16px rgba(11,61,44,.07); }
.panel h3 { font-size: 1.1rem; color: var(--head); margin-bottom: .4rem; }
.panel h4 { font-size: 1rem; color: var(--head); margin-bottom: .3rem; }
.hint { color: var(--muted); font-size: .9rem; margin-bottom: .8rem; }
.muted { color: var(--muted); font-size: .85rem; }

.timeline { position: relative; padding-left: 2.2rem; max-width: 720px; }
.timeline::before { content: ""; position: absolute; left: 14px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: linear-gradient(var(--lime), var(--green), var(--teal)); }
.step { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.1rem 1.3rem; margin-bottom: 1.1rem; box-shadow: 0 3px 12px rgba(11,61,44,.06); }
.step::before { content: attr(data-n); position: absolute; left: -2.2rem; top: 1rem; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--green); color: #fff; font-weight: 800; font-size: .85rem; box-shadow: 0 0 0 4px var(--bg); }
.step h4 { font-size: 1.02rem; color: var(--head); margin-bottom: .25rem; }
.step p { font-size: .92rem; color: var(--muted); }
.step .fact { margin-top: .5rem; font-size: .85rem; font-weight: 700; color: var(--green); }

label { display: block; margin: 12px 0 6px; font-size: .9rem; font-weight: 600; color: var(--muted); }
input, select { width: 100%; padding: .65rem .8rem; border-radius: 12px; font-size: .95rem; background: var(--input); border: 1.5px solid var(--line); color: var(--text); outline: none; }
input:focus, select:focus { border-color: var(--green); }

button { margin-top: 12px; width: 100%; padding: .7rem 1rem; border: none; border-radius: 12px; background: linear-gradient(135deg, var(--green), var(--teal)); color: #fff; font-weight: 700; font-size: .95rem; cursor: pointer; }
button:hover { filter: brightness(1.05); }
button:disabled { background: #d1d5db; color: #6b7280; cursor: not-allowed; }
button.small { width: auto; margin: 0; padding: .4rem .8rem; font-size: .85rem; }
button.ghost { background: #e5e7eb; color: #0b3d2c; }

.rate-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .6rem; }
.rate-row span { flex: 1; font-weight: 600; }
.rate-row input { width: 100px; }
.rate-row small { color: var(--muted); width: 60px; }

.code-box { margin-top: 14px; padding: 16px; border-radius: 14px; background: var(--soft); border: 1.5px dashed var(--green); display: none; text-align: center; }
.code-box.show { display: block; }
.code { font-size: 1.8rem; font-weight: 800; letter-spacing: .15em; margin: 6px 0; color: var(--head); }
#qr {
     display: flex; justify-content: center; margin: 10px 0; 
}
#qr img, #qr canvas {
     background: #fff; padding: 6px; border-radius: 10px; 
}

.products {
     display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.1rem; 
}
.product {
     border-radius: 20px; padding: 1.1rem; text-align: center; color: var(--head); display: flex; flex-direction: column; background: linear-gradient(160deg, var(--soft) 0%, var(--card) 70%); border: 1.5px solid #bef264; 
}
.product .img {
     height: 130px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #d9f99d, transparent 70%); border-radius: 14px; margin-bottom: .8rem; 
}
.product .img svg {
     width: 120px; height: 96px; 
}
.product h4 {
     font-size: 1.02rem;
}
.product .price { 
color: var(--green); font-weight: 800; }
.product button {
     margin-top: auto; 
}

.msg {
     margin-top: 10px;
     font-size: .9rem;
     color: var(--green); min-height: 18px; font-weight: 600;
}
.msg.error {
     color: #b91c1c; 
}

table { 
     width: 100%;
     border-collapse: collapse;
     font-size: .88rem;
}
td, th {
     text-align: left;
     padding: .5rem .3rem;
     border-bottom: 1px solid var(--line);
     vertical-align: middle;
}
th { 
     color: var(--muted);
     font-weight: 600;
}
.status { 
     font-size: .8rem;
     font-weight: 700;
     padding: .2rem .6rem;
     border-radius: 999px; 
}
.status.pending {
     background: #fef3c7;
     color: #92400e; 
}
.status.done {
     background: #d9f99d;
     color: #0b3d2c; 
}
.status.expired {
     background: #fee2e2; 
     color: #991b1b; 
}

.stats {
     display: grid;
     grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
     gap: 1rem;
     margin-bottom: 1.2rem; 
}
.stat { 
     background: var(--card);
     border: 1px solid var(--line);
     border-radius: 18px;
     padding: 1.2rem;
     text-align: center; 
}
.stat b {
     display: block;
     font-size: 1.6rem;
     color: var(--green); 
}
.chart-wrap { 
     background: var(--card);
     border: 1px solid var(--line);
     border-radius: 20px; 
     padding: 1.2rem;
     max-width: 720px; 
}

.map-filters {
     display: flex;
     gap: .7rem;
     flex-wrap: wrap;
     margin-bottom: 1rem; 
}
.map-filters select {
     flex: 1;
     min-width: 200px;
     max-width: 320px; 
}
#map {
     height: 460px;
     border-radius: 16px;
     border: 1px solid var(--line);
     margin-bottom: 1.2rem;
     z-index: 0;
     background: var(--soft); 
}
.map-error {
     display: flex;
     align-items: center;
     justify-content: center;
     height: 100%;
     color: var(--muted);
     padding: 1rem;
     text-align: center; 
}
.pcards {
     display: grid;
     grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
     gap: 1rem; 
}
.pcard {
     background: var(--card);
     border: 1px solid var(--line);
     border-radius: 16px;
     padding: 1rem; 
}
.pcard a {
     color: var(--green);
     font-weight: 600;
     margin-right: .8rem;
     text-decoration: none; 
}
.no-punkt {
     grid-column: 1 / -1;
     color: var(--muted);
      padding: .5rem 0;
}

.contact-links {
     display: flex;
     flex-direction: column;
     gap: .7rem; 
}
.contact-links a {
     display: flex;
     justify-content: space-between;
     padding: .8rem 1rem;
     border-radius: 12px;
     text-decoration: none;
     color: var(--head);
     background: var(--soft);
     border: 1.5px solid var(--line);
     font-weight: 600; 
}
.contact-links a small {
     color: var(--muted);
     font-weight: 500; 
}

dialog {
     border: none;
     border-radius: 20px;
     padding: 1.5rem;
     max-width: 380px;
     width: 90%;
     background: var(--card);
     color: var(--text);
 }
dialog::backdrop {
     background: rgba(0,0,0,.45); 
}
.dlg-actions {
     display: flex;
     gap: .6rem;
     justify-content: flex-end;
     margin-top: 1rem; 
}

footer {
     padding: 2.2rem 0;
     text-align: center;
     font-size: .85rem;
     color: #f0fff4;
     background: var(--nav); 
}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <span class="logo">🌱 EkoCoin</span>
    <div class="links">
      <a href="#info" data-i18n="nav_info"></a>
      <a href="#waste" data-i18n="nav_waste"></a>
      <a href="#shop" data-i18n="nav_shop"></a>
      <a href="#punkt" data-i18n="nav_punkt"></a>
      <a href="#map-sec" data-i18n="nav_map"></a>
      <a href="#stats" data-i18n="nav_stats"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </div>
    <div class="tools">
      <select id="langSelect" aria-label="Language">
        <option value="uz">O'zbekcha</option>
        <option value="cy">Ўзбекча</option>
        <option value="ru">Русский</option>
      </select>
      <button id="themeBtn" class="ghost" data-i18n="theme_btn"></button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <span class="badge" data-i18n="badge"></span>
    <h1 data-i18n="hero_title"></h1>
    <p class="sub" data-i18n="hero_sub"></p>
    <div class="balance" id="balance">0 coin</div>
  </div>
</header>

<section id="info" class="wrap">
  <p class="eyebrow" data-i18n="info_eyebrow"></p>
  <h2 data-i18n="info_title"></h2>
  <div class="timeline">
    <div class="step" data-n="1"><h4 data-i18n="s1h"></h4><p data-i18n="s1p"></p><div class="fact" data-i18n="s1f"></div></div>
    <div class="step" data-n="2"><h4 data-i18n="s2h"></h4><p data-i18n="s2p"></p><div class="fact" data-i18n="s2f"></div></div>
    <div class="step" data-n="3"><h4 data-i18n="s3h"></h4><p data-i18n="s3p"></p><div class="fact" data-i18n="s3f"></div></div>
    <div class="step" data-n="4"><h4 data-i18n="s4h"></h4><p data-i18n="s4p"></p><div class="fact" data-i18n="s4f"></div></div>
  </div>
</section>

<section id="waste" class="wrap">
  <p class="eyebrow" data-i18n="waste_eyebrow"></p>
  <h2 data-i18n="waste_title"></h2>
  <div class="grid">
    <div class="panel">
      <h3 data-i18n="form_title"></h3>
      <p class="hint" data-i18n="form_hint"></p>
      <label for="uname" data-i18n="f_name"></label>
      <input id="uname" data-i18n-ph="ph_name">
      <label for="phone" data-i18n="f_phone"></label>
      <input id="phone" data-i18n-ph="ph_phone">
      <label for="type" data-i18n="f_type"></label>
      <select id="type"></select>
      <label for="kg" data-i18n="f_kg"></label>

      <button id="submitBtn" data-i18n="btn_submit"></button>
      <div class="msg" id="wasteMsg"></div>

      <div class="code-box" id="codeBox">
        <div data-i18n="code_label"></div>
        <div class="code" id="codeText"></div>
        <div id="qr"></div>
        <div class="muted" id="codeExp"></div>
        <div class="muted" data-i18n="code_hint"></div>
      </div>
    </div>

    <div class="panel">
      <h3 data-i18n="rates_title"></h3>
      <p class="hint" data-i18n="rates_hint"></p>
      <div id="rateInputs"></div>
      <button id="saveRatesBtn" data-i18n="btn_rates"></button>
      <div class="msg" id="ratesMsg"></div>
    </div>
  </div>
</section>

<section id="punkt" class="wrap">
  <p class="eyebrow" data-i18n="punkt_eyebrow"></p>
  <h2 data-i18n="punkt_title"></h2>
  <div class="panel">
    <p class="hint" data-i18n="punkt_hint"></p>
    <table>
      <thead><tr>
        <th data-i18n="th_code"></th><th data-i18n="th_name"></th><th data-i18n="th_phone"></th>
        <th data-i18n="th_waste"></th><th data-i18n="th_status"></th><th></th>
      </tr></thead>
      <tbody id="submissions"></tbody>
    </table>
    <div class="msg" id="punktMsg"></div>
  </div>
</section>

<section id="map-sec" class="wrap">
  <p class="eyebrow" data-i18n="nav_map"></p>
  <h2 data-i18n="map_title"></h2>
  <div class="map-filters">
    <select id="regionFilter" aria-label="Viloyat"></select>
    <select id="districtFilter" aria-label="Tuman"></select>
  </div>
  <div id="map"></div>
  <div class="pcards" id="punktList"></div>
</section>

<section id="stats" class="wrap">
  <p class="eyebrow" data-i18n="stats_eyebrow"></p>
  <h2 data-i18n="stats_title"></h2>
  <div class="stats">
    <div class="stat"><span class="muted" data-i18n="stat_kg"></span><b id="statKg">0 kg</b></div>
    <div class="stat"><span class="muted" data-i18n="stat_count"></span><b id="statCount">0</b></div>
    <div class="stat"><span class="muted" data-i18n="stat_co2"></span><b id="statCo2">0 kg</b></div>
  </div>
  <div class="chart-wrap">
    <p class="muted" data-i18n="stat_chart"></p>
    <canvas id="chart" height="160"></canvas>
  </div>
  <p class="muted" style="margin-top:.8rem" data-i18n="stat_note"></p>
</section>

<section id="shop" class="wrap">
  <p class="eyebrow" data-i18n="shop_eyebrow"></p>
  <h2 data-i18n="shop_title"></h2>
  <div class="panel">
    <div class="products" id="catalog"></div>
    <div class="msg" id="redeemMsg"></div>
  </div>
</section>

<section id="faq" class="wrap lite">
  <p class="eyebrow">FAQ</p>
  <h2 data-i18n="faq_title"></h2>
  <div class="grid">
    <div class="panel"><h4 data-i18n="faq_q1"></h4><p class="hint" data-i18n="faq_a1"></p></div>
    <div class="panel"><h4 data-i18n="faq_q2"></h4><p class="hint" data-i18n="faq_a2"></p></div>
    <div class="panel"><h4 data-i18n="faq_q3"></h4><p class="hint" data-i18n="faq_a3"></p></div>
  </div>
</section>

<section id="contact" class="wrap lite">
  <div class="grid">
    <div class="panel">
      <h3 data-i18n="contact_title"></h3>
      <p class="hint" data-i18n="contact_hint"></p>
      <div class="contact-links">
        <a href="tel:+998900000000">Telefon <small>+998 90 000 00 00</small></a>
        <a href="https://t.me/username">Telegram <small>@username</small></a>
        <a href="mailto:info@example.com">Email <small>info@example.com</small></a>
      </div>
    </div>

    <div class="panel">
      <h3 data-i18n="history_title"></h3>
      <p class="hint" data-i18n="history_hint"></p>
      <table>
        <thead><tr><th data-i18n="th_date"></th><th data-i18n="th_action2"></th><th data-i18n="th_coin"></th></tr></thead>
        <tbody id="history"></tbody>
      </table>
      <button id="exportBtn" class="ghost" data-i18n="btn_export"></button>
    </div>
  </div>
</section>

<footer data-i18n="footer"></footer>

<dialog id="confirmDlg">
  <h3 data-i18n="confirm_title"></h3>
  <p class="hint" id="confirmText"></p>
  <div class="dlg-actions">
    <button class="small ghost" id="dlgCancel" data-i18n="btn_cancel"></button>
    <button class="small" id="dlgOk" data-i18n="btn_ok"></button>
  </div>
</dialog>

// ================= Holat =================
const defaults = () => ({
  balance: 0, rates: { ...RATE_DEFAULTS }, history: [], submissions: [],
  stock: { airpods: 5, phone: 2, laptop: 1 }, lang: 'uz', theme: null, notified: {}
});
let state = defaults();
let pendingCode = null;
let map = null;
let markers = [];
let chart = null;

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) state = { ...defaults(), ...JSON.parse(s) };
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

// ================= Yordamchilar =================
const $ = id => document.getElementById(id);
function el(tag, text, cls) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;
  return e;
}
function t(key) { return (T[state.lang] && T[state.lang][key]) || T.uz[key] || key; }
function fmt(key, ...args) {
  let s = t(key);
  args.forEach(a => { s = s.replace('%s', String(a)); });
  return s;
}
function typeName(k) { return t('type_' + k); }
function loc() { return state.lang === 'ru' ? 'ru-RU' : 'uz-UZ'; }
function setMsg(id, text, isError = false) {
  const m = $(id);
  m.textContent = text;
  m.classList.toggle('error', isError);
}
function statusOf(s) {
  if (s.status === 'done') return 'done';
  return s.expiresAt < Date.now() ? 'expired' : 'pending';
}
function addHistory(action, coins) {
  state.history.unshift({ date: Date.now(), action, coins });
  state.history = state.history.slice(0, 50);
}
function makeCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 0, O, 1, I yo'q
  let code;
  do {
    const r = crypto.getRandomValues(new Uint8Array(6));
    code = [...r].map(x => alphabet[x % alphabet.length]).join('');
  } while (state.submissions.some(s => s.code === code));
  return code;
}

// ================= Mavzu =================
function applyTheme() {
  const dark = state.theme ? state.theme === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

// ================= Tarjima qo'llash =================
function applyI18n() {
  document.documentElement.lang = state.lang === 'ru' ? 'ru' : 'uz';
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  $('langSelect').value = state.lang;
  renderRates();
  renderAll();
}

// ================= Kurslar =================
function renderRates() {
  const select = $('type');
  const prev = select.value;
  select.innerHTML = '';
  for (const k of TYPE_IDS) {
    const o = el('option', `${typeName(k)} (1 kg = ${state.rates[k]} coin)`);
    o.value = k;
    select.appendChild(o);
  }
  if (prev) select.value = prev;

  const box = $('rateInputs');
  box.innerHTML = '';
  for (const k of TYPE_IDS) {
    const row = el('div', '', 'rate-row');
    const inp = el('input');
    inp.type = 'number'; inp.min = '0'; inp.step = '1';
    inp.id = 'rate-' + k;
    inp.value = state.rates[k];
    row.append(el('span', typeName(k)), inp, el('small', 'coin/kg'));
    box.appendChild(row);
  }
}

function saveRates() {
  const vals = {};
  for (const k of TYPE_IDS) {
    const v = Number($('rate-' + k).value);
    if (isNaN(v) || v < 0 || v > 100000) return setMsg('ratesMsg', t('rates_bad'), true);
    vals[k] = Math.round(v);
  }
  Object.assign(state.rates, vals);
  save();
  renderRates();
  setMsg('ratesMsg', t('rates_ok'));
}

// ================= Topshirish =================
function requestNotif() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function showCode(code, expiresAt) {
  $('codeText').textContent = code;
  $('qr').innerHTML = '';
  if (window.QRCode) new QRCode($('qr'), { text: code, width: 140, height: 140 });
  $('codeExp').textContent = fmt('code_expires', new Date(expiresAt).toLocaleString(loc()));
  $('codeBox').classList.add('show');
}

function submitWaste() {
  const name = $('uname').value.trim();
  const phone = $('phone').value.replace(/[\s-]/g, '');
  const type = $('type').value;
  const kg = Number($('kg').value);

  if (name.length < 3) return setMsg('wasteMsg', t('err_name'), true);
  if (!/^\+?\d{9,15}$/.test(phone)) return setMsg('wasteMsg', t('err_phone'), true);
  if (!(kg >= 0.1 && kg <= 1000)) return setMsg('wasteMsg', t('err_kg'), true);

  const now = Date.now();
  const code = makeCode();
  const coins = Math.round(kg * state.rates[type]);
  state.submissions.unshift({
    code, name, phone, type, kg, coins, status: 'pending',
    createdAt: now, expiresAt: now + DAY
  });
  save();
  requestNotif();
  showCode(code, now + DAY);
  setMsg('wasteMsg', fmt('submitted', coins));
  renderPunkt();
  renderStats();
}

// ================= Punkt paneli =================
function renderPunkt() {
  const tb = $('submissions');
  tb.innerHTML = '';
  if (!state.submissions.length) {
    const tr = el('tr'); const td = el('td', t('no_sub')); td.colSpan = 6;
    tr.appendChild(td); tb.appendChild(tr);
    return;
  }
  for (const s of state.submissions) {
    const st = statusOf(s);
    const tr = el('tr');

    const codeTd = el('td'); codeTd.appendChild(el('b', s.code));
    const statusTd = el('td');
    statusTd.appendChild(el('span', t('st_' + st), 'status ' + st));
    const actTd = el('td');
    if (st === 'pending') {
      const b = el('button', t('btn_confirm'), 'small');
      b.addEventListener('click', () => openConfirm(s.code));
      actTd.appendChild(b);
    }

    tr.append(codeTd, el('td', s.name), el('td', s.phone),
      el('td', `${s.kg} kg ${typeName(s.type)} (${s.coins} coin)`), statusTd, actTd);
    tb.appendChild(tr);
  }
}

function openConfirm(code) {
  const s = state.submissions.find(x => x.code === code);
  if (!s) return;
  pendingCode = code;
  $('confirmText').textContent = fmt('confirm_text', `${s.name} · ${s.phone}`, s.kg, typeName(s.type), s.coins);
  $('confirmDlg').showModal();
}

function confirmSubmission(code) {
  const s = state.submissions.find(x => x.code === code);
  if (!s) return;
  const st = statusOf(s);
  if (st === 'done') return setMsg('punktMsg', t('done_err'), true);
  if (st === 'expired') return setMsg('punktMsg', t('expired_err'), true);

  s.status = 'done';
  state.balance += s.coins;
  addHistory(`${s.kg} kg ${typeName(s.type)} (${s.code})`, s.coins);
  save();
  renderAll();
  setMsg('punktMsg', fmt('confirmed', s.code, s.coins));
}

// ================= Xarita =================
const GEO_KEY = 'ekocoin_geo_v1';
let geoCache = {};
try { geoCache = JSON.parse(localStorage.getItem(GEO_KEY) || '{}'); } catch (e) { geoCache = {}; }
let geoChain = Promise.resolve();
let areaMarker = null;

// Joy nomini koordinataga aylantiradi. Natija keshlanadi, so'rovlar orasida 1.1 soniya kutiladi.
function geocode(query) {
  if (geoCache[query]) return Promise.resolve(geoCache[query]);
  geoChain = geoChain
    .then(() => new Promise(r => setTimeout(r, 1100)))
    .then(async () => {
      if (geoCache[query]) return geoCache[query];
      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=uz&q='
          + encodeURIComponent(query);
        const res = await fetch(url);
        const data = await res.json();
        if (data[0]) {
          geoCache[query] = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
          localStorage.setItem(GEO_KEY, JSON.stringify(geoCache));
          return geoCache[query];
        }
      } catch (e) {
        console.error('Geokodlash xatosi:', e);
      }
      return null;
    });
  return geoChain;
}

// Tanlangan hudud markazini xaritada ko'rsatadi
function showAreaOnMap(query, key, zoom, label) {
  geocode(query).then(c => {
    if (!c || !map) return;
    // Foydalanuvchi tanlovini o'zgartirgan bo'lsa, eski natijani ko'rsatmaymiz
    if (key !== $('regionFilter').value + '|' + $('districtFilter').value) return;
    if (areaMarker) areaMarker.remove();
    areaMarker = L.circleMarker([c.lat, c.lng], {
      radius: 10, color: '#0b3d2c', weight: 2, fillColor: '#a3e635', fillOpacity: 0.6
    }).addTo(map).bindPopup(label);
    map.setView([c.lat, c.lng], zoom);
  });
}

function initMap() {
  if (map) return true;
  if (!window.L) {
    const box = $('map');
    box.innerHTML = '';
    box.appendChild(el('div', t('map_error'), 'map-error'));
    console.error('Leaflet yuklanmadi. Internet yoki CDN ulanishini tekshiring.');
    return false;
  }
  map = L.map('map', {
    minZoom: 5,
    maxBounds: [[36.5, 54.5], [46.5, 74.5]],
    maxBoundsViscosity: 0.8
  }).setView(UZ_CENTER, UZ_ZOOM);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles © Esri, OpenStreetMap contributors'
  }).addTo(map);

  setTimeout(() => map && map.invalidateSize(), 300);
  return true;
}

// Viloyat va tuman ro'yxatlarini to'ldiradi
function populateFilters() {
  const regionSel = $('regionFilter');
  const districtSel = $('districtFilter');
  const region = regionSel.value;
  const district = districtSel.value;

  regionSel.innerHTML = '';
  regionSel.appendChild(new Option(t('all_regions'), ''));
  Object.keys(REGIONS).forEach(r => regionSel.appendChild(new Option(r, r)));
  regionSel.value = region;

  const districts = region
    ? REGIONS[region]
    : [...new Set(Object.values(REGIONS).flat())].sort((a, b) => a.localeCompare(b));

  districtSel.innerHTML = '';
  districtSel.appendChild(new Option(t('all_districts'), ''));
  districts.forEach(d => districtSel.appendChild(new Option(d, d)));
  districtSel.value = districts.includes(district) ? district : '';
}

function renderMapList() {
  populateFilters();
  if (!initMap()) {
    $('punktList').innerHTML = '';
    return;
  }
  map.invalidateSize();

  const region = $('regionFilter').value;
  const district = $('districtFilter').value;
  const key = region + '|' + district;
  const list = PUNKTS.filter(p =>
    (!region || p.region === region) && (!district || p.district === district));

  markers.forEach(m => m.remove());
  markers = list.map(p =>
    L.marker([p.lat, p.lng]).addTo(map).bindPopup(`<b>${p.name}</b><br>${p.addr}<br>${p.tel}`)
  );
  if (areaMarker) { areaMarker.remove(); areaMarker = null; }

  if (markers.length) {
    // Punkt bor bo'lsa, o'shalarga yaqinlashamiz
    map.fitBounds(L.featureGroup(markers).getBounds(), {
      maxZoom: district ? 12 : 10,
      padding: [40, 40]
    });
  } else if (district) {
    // Punkt yo'q, lekin tuman tanlangan: tuman markazini topib ko'rsatamiz
    showAreaOnMap(`${district}, ${region || ''}, Uzbekistan`.replace(', ,', ','), key, 11, district);
  } else if (region) {
    // Viloyatda ham punkt yo'q bo'lsa, viloyat markazini ko'rsatamiz
    showAreaOnMap(`${region}, Uzbekistan`, key, 9, region);
  } else {
    map.setView(UZ_CENTER, UZ_ZOOM);
  }

  const box = $('punktList');
  box.innerHTML = '';
  if (!list.length) {
    box.appendChild(el('p', t('no_punkt'), 'no-punkt'));
    return;
  }
  for (const p of list) {
    const card = el('div', '', 'pcard');
    card.append(
      el('b', p.name),
      el('div', `${p.region}, ${p.district}`, 'muted'),
      el('div', `${t('hours')}: ${p.hours}`)
    );
    const links = el('div');
    links.style.marginTop = '.5rem';
    const tel = el('a', t('call'));
    tel.href = 'tel:' + p.tel.replace(/\s/g, '');
    const dir = el('a', t('directions'));
    dir.href = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
    dir.target = '_blank';
    dir.rel = 'noopener';
    links.append(tel, dir);
    card.appendChild(links);
    box.appendChild(card);
  }
}

// ================= Statistika =================
function renderStats() {
  const done = state.submissions.filter(s => s.status === 'done');
  const kg = done.reduce((a, s) => a + s.kg, 0);
  const co2 = done.reduce((a, s) => a + s.kg * CO2[s.type], 0);
  $('statKg').textContent = kg.toFixed(1) + ' kg';
  $('statCount').textContent = done.length;
  $('statCo2').textContent = co2.toFixed(1) + ' kg';

  if (!window.Chart) return;
  const perType = TYPE_IDS.map(k => done.filter(s => s.type === k).reduce((a, s) => a + s.kg, 0));
  if (!chart) {
    chart = new Chart($('chart'), {
      type: 'bar',
      data: { labels: [], datasets: [{ data: [], backgroundColor: ['#1f8a4c', '#14b8a6', '#a3e635', '#0b3d2c'] }] },
      options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
    });
  }
  chart.data.labels = TYPE_IDS.map(typeName);
  chart.data.datasets[0].data = perType;
  chart.update();
}

// ================= Mukofot =================
function renderShop() {
  const box = $('catalog');
  box.innerHTML = '';
  for (const item of CATALOG) {
    const left = state.stock[item.id] || 0;
    const card = el('div', '', 'product');
    const img = el('div', '', 'img');
    img.innerHTML = item.svg; // faqat o'zimizning doimiy SVG
    const btn = el('button', '');
    if (left <= 0) {
      btn.textContent = t('btn_out'); btn.disabled = true;
    } else if (state.balance < item.price) {
      btn.textContent = t('btn_low'); btn.disabled = true;
    } else {
      btn.textContent = t('btn_redeem');
      btn.addEventListener('click', () => redeem(item.id));
    }
    card.append(img, el('h4', t('item_' + item.id)),
      el('div', item.price.toLocaleString(loc()) + ' coin', 'price'),
      el('div', fmt('stock_left', left), 'muted'), btn);
    box.appendChild(card);
  }
}

function redeem(id) {
  const item = CATALOG.find(i => i.id === id);
  if (!item || (state.stock[id] || 0) <= 0 || state.balance < item.price) return;
  state.balance -= item.price;
  state.stock[id]--;
  addHistory(`${t('item_' + id)} ${t('redeem_action')}`, -item.price);
  save();
  renderAll();
  setMsg('redeemMsg', fmt('redeem_ok', t('item_' + id)));
}

// ================= Tarix va eksport =================
function renderHistory() {
  const h = $('history');
  h.innerHTML = '';
  if (!state.history.length) {
    const tr = el('tr'); const td = el('td', t('history_empty')); td.colSpan = 3;
    tr.appendChild(td); h.appendChild(tr);
    return;
  }
  for (const x of state.history) {
    const tr = el('tr');
    tr.append(
      el('td', new Date(x.date).toLocaleString(loc())),
      el('td', x.action),
      el('td', (x.coins > 0 ? '+' : '') + x.coins)
    );
    h.appendChild(tr);
  }
}

function exportCsv() {
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const rows = [['date', 'action', 'coins'].join(',')];
  for (const h of state.history) {
    rows.push([esc(new Date(h.date).toISOString()), esc(h.action), h.coins].join(','));
  }
  const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ekocoin-tarix.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

function checkExpiring() {
  const now = Date.now();
  let changed = false;
  for (const s of state.submissions) {
    if (s.status !== 'pending' || state.notified[s.code]) continue;
    const left = s.expiresAt - now;
    if (left > 0 && left <= 60 * 60 * 1000) {
      state.notified[s.code] = true;
      changed = true;
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(t('notify_title'), { body: fmt('notify_body', s.code) });
      }
    }
  }
  if (changed) save();
}

// ================= Umumiy render =================
function renderAll() {
  $('balance').textContent = state.balance + ' coin';
  renderShop();
  renderPunkt();
  renderStats();
  renderHistory();
  renderMapList();
}

// ================= Hodisalar =================
$('submitBtn').addEventListener('click', submitWaste);
$('saveRatesBtn').addEventListener('click', saveRates);
$('exportBtn').addEventListener('click', exportCsv);
$('regionFilter').addEventListener('change', () => {
  $('districtFilter').value = '';
  renderMapList();
});
$('districtFilter').addEventListener('change', () => {
  // Viloyat tanlanmagan bo'lsa, tuman qaysi viloyatda ekanini topib qo'yamiz
  const district = $('districtFilter').value;
  if (district && !$('regionFilter').value) {
    const found = Object.entries(REGIONS).find(([, list]) => list.includes(district));
    if (found) $('regionFilter').value = found[0];
  }
  renderMapList();
});
$('dlgCancel').addEventListener('click', () => $('confirmDlg').close());
$('dlgOk').addEventListener('click', () => {
  $('confirmDlg').close();
  if (pendingCode) confirmSubmission(pendingCode);
  pendingCode = null;
});
$('langSelect').addEventListener('change', e => {
  state.lang = e.target.value;
  save();
  applyI18n();
});
$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme;
  state.theme = cur === 'dark' ? 'light' : 'dark';
  save();
  applyTheme();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!state.theme) applyTheme();
});
window.addEventListener('resize', () => map && map.invalidateSize());

// ================= Ishga tushirish =================
load();
applyTheme();
applyI18n();
checkExpiring();
setInterval(checkExpiring, 60 * 1000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
